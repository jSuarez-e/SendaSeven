services:
  postgres:
    image: postgres:16-alpine
    container_name: sendaseven_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-votacion_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-votacion_secret}
      POSTGRES_DB: ${DB_NAME:-rutas_turisticas_db}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-votacion_user} -d ${DB_NAME:-rutas_turisticas_db}']
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sendaseven_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-votacion_user}:${DB_PASSWORD:-votacion_secret}@postgres:5432/${DB_NAME:-rutas_turisticas_db}?schema=public
      PORT: 3000
      NODE_ENV: production
      DB_SYNCHRONIZE: "true"
    ports:
      - '3000:3000'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sendaseven_ui
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'

volumes:
  pgdata: